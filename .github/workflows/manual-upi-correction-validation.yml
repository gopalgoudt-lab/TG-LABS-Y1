name: Manual UPI Correction Validation

on:
  pull_request:
    paths:
      - 'lib/manual-upi-correction.ts'
      - 'tests/manual-upi-correction.test.ts'
      - 'lib/corrected-manual-upi-receipt.ts'
      - 'tests/corrected-manual-upi-receipt.test.ts'
      - 'lib/manual-upi-correction-preflight.ts'
      - 'lib/manual-upi-approval-evidence.ts'
      - 'lib/manual-upi-atomic-adjustment.ts'
      - 'tests/manual-upi-atomic-adjustment.test.ts'
      - 'lib/manual-upi-transaction-audit.ts'
      - 'tests/manual-upi-approval-evidence.test.ts'
      - 'tests/manual-upi-correction-preflight.test.ts'
      - 'app/api/admin/bookings/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/manual-upi-correction-validation.yml'
  workflow_dispatch:

jobs:
  manual-upi-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          NEON_DATABASE_URL: postgresql://validation:validation@localhost:5432/validation?schema=public
      - name: Generate Prisma client for API build
        run: npx prisma generate
        env:
          NEON_DATABASE_URL: postgresql://validation:validation@localhost:5432/validation?schema=public
      - name: Test manual UPI amount rules
        run: node --import tsx --test tests/manual-upi-correction.test.ts tests/corrected-manual-upi-receipt.test.ts tests/manual-upi-correction-preflight.test.ts tests/manual-upi-approval-evidence.test.ts tests/manual-upi-atomic-adjustment.test.ts
      - name: Typecheck transaction service in isolation
        run: npx tsc --noEmit --skipLibCheck --target es2022 --module commonjs --moduleResolution node --esModuleInterop --types node lib/manual-upi-atomic-adjustment.ts lib/manual-upi-transaction-audit.ts tests/manual-upi-atomic-adjustment.test.ts
      - name: Typecheck correction files in isolation
        run: npx tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --types node lib/manual-upi-correction.ts lib/corrected-manual-upi-receipt.ts lib/manual-upi-correction-preflight.ts lib/manual-upi-approval-evidence.ts tests/manual-upi-approval-evidence.test.ts tests/manual-upi-correction-preflight.test.ts tests/manual-upi-correction.test.ts tests/corrected-manual-upi-receipt.test.ts
