name: Phase 2C Production Prisma History Baseline

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BASELINE_20_HISTORICAL_MIGRATIONS_ONLY
        required: true
        type: string
      expected_schema_sha256:
        description: Approved preflight schema fingerprint excluding _prisma_migrations
        required: true
        type: string
      expected_core_counts_sha256:
        description: Approved preflight core row-count fingerprint
        required: true
        type: string
      expected_application_data_sha256:
        description: Approved preflight application-data fingerprint excluding _prisma_migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase2c-production-prisma-history-baseline
  cancel-in-progress: false

jobs:
  baseline-history-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPROVED_SHA: 4643df644fef735c65d9cb9139f8b756d331309f
      EXPECTED_PR_HEAD: ad068cb4552ae5de0693faa9c1fc3589c67f49f2
      WORKFLOW_BRANCH: ops/phase2c-production-prisma-baseline-prep
      NEON_PROJECT_ID: still-lake-20474769
      PRODUCTION_BRANCH_ID: br-wandering-resonance-axwu851y
      PRODUCTION_BRANCH_NAME: production
      PRODUCTION_DATABASE: neondb
      RECOVERY_CHECKPOINT_ID: br-mute-sky-axe5a0c0
      PHASE2C1_MIGRATION: 20260829153000_phase2c1_catalog_eligibility_foundation
      PRODUCTION_HEALTH_URL: https://www.tglabs.in/api/health

    steps:
      - name: Check out exactly the approved Production main SHA
        uses: actions/checkout@v4
        with:
          ref: 4643df644fef735c65d9cb9139f8b756d331309f
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable GitHub identities and manual authorization
        shell: bash
        env:
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          set +x
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "$WORKFLOW_BRANCH"
          test "$DISPATCH_CONFIRMATION" = "BASELINE_20_HISTORICAL_MIGRATIONS_ONLY"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse origin/main)" = "$APPROVED_SHA"

          main_sha="$(curl --fail --silent --show-error \
            https://api.github.com/repos/gopalgoudt-lab/TG-LABS-Y1/git/ref/heads/main | jq -r '.object.sha')"
          test "$main_sha" = "$APPROVED_SHA"

          pr_json="$(mktemp)"
          curl --fail --silent --show-error \
            https://api.github.com/repos/gopalgoudt-lab/TG-LABS-Y1/pulls/21 > "$pr_json"
          test "$(jq -r '.state' "$pr_json")" = "open"
          test "$(jq -r '.merged_at // ""' "$pr_json")" = ""
          test "$(jq -r '.head.sha' "$pr_json")" = "$EXPECTED_PR_HEAD"
          rm -f "$pr_json"

      - name: Verify and mask all runtime credentials before database access
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.PHASE2C_PRODUCTION_NEON_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.PHASE2B_NEON_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          set +x
          test -n "$NEON_DATABASE_URL"
          test -n "$NEON_API_KEY"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          echo "::add-mask::$NEON_DATABASE_URL"
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Verify exact historical migration set from the approved SHA
        shell: bash
        run: |
          set -euo pipefail
          set +x
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "$expected" <<'MIGRATIONS'
          20260815130000_init
          20260816105000_add_razorpay_booking_fields
          20260816193000_add_whatsapp_notification_tracking
          20260817112000_admin_catalog_and_manual_booking
          20260817113000_add_sample_types
          20260817124500_booking_admin_edit_fields
          20260817133000_add_booking_pincode
          20260817142000_add_technicians
          20260817143000_add_sample_processing_workflow
          20260817161000_phase23_technician_portal
          20260817193000_booking_packages
          20260817201500_patient_profile_fields
          20260818173000_phase28_payment_hardening
          20260820161000_add_admin_audit_log
          20260820170500_phase9_doctor_printed_reports
          20260820193000_persist_ai_reports
          20260821194000_add_thyrocare_credentials
          20260824120500_add_technician_live_location
          20260824131500_add_booking_idempotency
          20260826190000_add_partner_offers
          MIGRATIONS

          find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql \
            -printf '%h\n' | xargs -r -n1 basename | LC_ALL=C sort > "$actual"
          test "$(wc -l < "$actual" | tr -d ' ')" = "20"
          ! grep -Fxq "$PHASE2C1_MIGRATION" "$actual"
          diff --unified=0 "$expected" "$actual"
          rm -f "$expected" "$actual"

      - name: Install pinned project dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install read-only PostgreSQL inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify Neon project, Production branch, checkpoint, database endpoint and health
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.PHASE2C_PRODUCTION_NEON_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.PHASE2B_NEON_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          set +x
          branches_json="$(mktemp)"
          endpoints_json="$(mktemp)"
          health_json="$(mktemp)"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" > "$branches_json"
          test "$(jq -r --arg id "$PRODUCTION_BRANCH_ID" '.branches[] | select(.id == $id) | .name' "$branches_json")" = "$PRODUCTION_BRANCH_NAME"
          test "$(jq -r --arg id "$RECOVERY_CHECKPOINT_ID" '[.branches[] | select(.id == $id)] | length' "$branches_json")" = "1"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/endpoints" > "$endpoints_json"
          expected_host="$(jq -r --arg branch "$PRODUCTION_BRANCH_ID" '.endpoints[] | select(.branch_id == $branch and .type == "read_write") | .host' "$endpoints_json" | head -n1)"
          actual_host="$(DATABASE_URL_FOR_PARSE="$NEON_DATABASE_URL" node -e 'const u=new URL(process.env.DATABASE_URL_FOR_PARSE); process.stdout.write(u.hostname)')"
          test -n "$expected_host"
          test "$actual_host" = "$expected_host"

          curl --fail --silent --show-error \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$PRODUCTION_HEALTH_URL" > "$health_json"
          test "$(jq -r '.database // ""' "$health_json" | tr '[:upper:]' '[:lower:]')" = "ok"
          rm -f "$branches_json" "$endpoints_json" "$health_json"

          test "$(psql "$NEON_DATABASE_URL" -XAtqc 'SELECT current_database()')" = "$PRODUCTION_DATABASE"

      - name: Run strict read-only Production preflight and record fingerprints
        id: preflight
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.PHASE2C_PRODUCTION_NEON_DATABASE_URL }}
          EXPECTED_SCHEMA_SHA256: ${{ inputs.expected_schema_sha256 }}
          EXPECTED_CORE_COUNTS_SHA256: ${{ inputs.expected_core_counts_sha256 }}
          EXPECTED_APPLICATION_DATA_SHA256: ${{ inputs.expected_application_data_sha256 }}
        run: |
          set -euo pipefail
          set +x
          for value in "$EXPECTED_SCHEMA_SHA256" "$EXPECTED_CORE_COUNTS_SHA256" "$EXPECTED_APPLICATION_DATA_SHA256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done

          test "$(psql "$NEON_DATABASE_URL" -XAtqc "SELECT to_regclass('public._prisma_migrations') IS NULL")" = "t"
          phase2c1_absent="$(psql "$NEON_DATABASE_URL" -XAtq <<'SQL'
          SELECT NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'DiagnosticPackageType')
            AND to_regclass('public."CatalogCategory"') IS NULL
            AND to_regclass('public."PackagePartnerOffer"') IS NULL
            AND to_regclass('public."PartnerServiceability"') IS NULL;
          SQL
          )"
          test "$phase2c1_absent" = "t"

          schema_sha="$(pg_dump "$NEON_DATABASE_URL" --schema-only --no-owner --no-privileges --exclude-table=public._prisma_migrations | sha256sum | cut -d' ' -f1)"
          app_data_sha="$(pg_dump "$NEON_DATABASE_URL" --data-only --no-owner --no-privileges --exclude-table=public._prisma_migrations | sha256sum | cut -d' ' -f1)"
          counts_sha="$(psql "$NEON_DATABASE_URL" -XAtqc '
            SELECT table_name || ''='' || row_count FROM (
              SELECT ''AdminAuditLog'' AS table_name, count(*)::text AS row_count FROM public."AdminAuditLog"
              UNION ALL SELECT ''Booking'', count(*)::text FROM public."Booking"
              UNION ALL SELECT ''BookingItem'', count(*)::text FROM public."BookingItem"
              UNION ALL SELECT ''BookingPackage'', count(*)::text FROM public."BookingPackage"
              UNION ALL SELECT ''DiagnosticPackage'', count(*)::text FROM public."DiagnosticPackage"
              UNION ALL SELECT ''DiagnosticPartner'', count(*)::text FROM public."DiagnosticPartner"
              UNION ALL SELECT ''DiagnosticTest'', count(*)::text FROM public."DiagnosticTest"
              UNION ALL SELECT ''Patient'', count(*)::text FROM public."Patient"
              UNION ALL SELECT ''PaymentTransaction'', count(*)::text FROM public."PaymentTransaction"
              UNION ALL SELECT ''RazorpayWebhookEvent'', count(*)::text FROM public."RazorpayWebhookEvent"
              UNION ALL SELECT ''TestPartnerOffer'', count(*)::text FROM public."TestPartnerOffer"
              UNION ALL SELECT ''Technician'', count(*)::text FROM public."Technician"
              UNION ALL SELECT ''TechnicianSession'', count(*)::text FROM public."TechnicianSession"
              UNION ALL SELECT ''ThyrocareCredential'', count(*)::text FROM public."ThyrocareCredential"
            ) counts ORDER BY table_name
          ' | sha256sum | cut -d' ' -f1)"

          test "$schema_sha" = "$EXPECTED_SCHEMA_SHA256"
          test "$counts_sha" = "$EXPECTED_CORE_COUNTS_SHA256"
          test "$app_data_sha" = "$EXPECTED_APPLICATION_DATA_SHA256"
          echo "schema_sha=$schema_sha" >> "$GITHUB_OUTPUT"
          echo "counts_sha=$counts_sha" >> "$GITHUB_OUTPUT"
          echo "app_data_sha=$app_data_sha" >> "$GITHUB_OUTPUT"

      - name: Mark only the 20 confirmed historical migrations as applied
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.PHASE2C_PRODUCTION_NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          set +x
          migrations=(
            20260815130000_init
            20260816105000_add_razorpay_booking_fields
            20260816193000_add_whatsapp_notification_tracking
            20260817112000_admin_catalog_and_manual_booking
            20260817113000_add_sample_types
            20260817124500_booking_admin_edit_fields
            20260817133000_add_booking_pincode
            20260817142000_add_technicians
            20260817143000_add_sample_processing_workflow
            20260817161000_phase23_technician_portal
            20260817193000_booking_packages
            20260817201500_patient_profile_fields
            20260818173000_phase28_payment_hardening
            20260820161000_add_admin_audit_log
            20260820170500_phase9_doctor_printed_reports
            20260820193000_persist_ai_reports
            20260821194000_add_thyrocare_credentials
            20260824120500_add_technician_live_location
            20260824131500_add_booking_idempotency
            20260826190000_add_partner_offers
          )
          for migration in "${migrations[@]}"; do
            test "$migration" != "$PHASE2C1_MIGRATION"
            npx --no-install prisma migrate resolve --schema prisma/schema.prisma --applied "$migration"
          done

      - name: Verify exact baseline history and unchanged Production state
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.PHASE2C_PRODUCTION_NEON_DATABASE_URL }}
          PRE_SCHEMA_SHA: ${{ steps.preflight.outputs.schema_sha }}
          PRE_COUNTS_SHA: ${{ steps.preflight.outputs.counts_sha }}
          PRE_APP_DATA_SHA: ${{ steps.preflight.outputs.app_data_sha }}
        run: |
          set -euo pipefail
          set +x
          expected="$(mktemp)"
          actual="$(mktemp)"
          find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql \
            -printf '%h\n' | xargs -r -n1 basename | LC_ALL=C sort > "$expected"
          psql "$NEON_DATABASE_URL" -XAtqc '
            SELECT migration_name FROM public._prisma_migrations
            WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL
            ORDER BY migration_name
          ' > "$actual"
          test "$(wc -l < "$actual" | tr -d ' ')" = "20"
          diff --unified=0 "$expected" "$actual"
          ! grep -Fxq "$PHASE2C1_MIGRATION" "$actual"
          test "$(psql "$NEON_DATABASE_URL" -XAtqc 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL')" = "0"

          post_schema_sha="$(pg_dump "$NEON_DATABASE_URL" --schema-only --no-owner --no-privileges --exclude-table=public._prisma_migrations | sha256sum | cut -d' ' -f1)"
          post_app_data_sha="$(pg_dump "$NEON_DATABASE_URL" --data-only --no-owner --no-privileges --exclude-table=public._prisma_migrations | sha256sum | cut -d' ' -f1)"
          post_counts_sha="$(psql "$NEON_DATABASE_URL" -XAtqc '
            SELECT table_name || ''='' || row_count FROM (
              SELECT ''AdminAuditLog'' AS table_name, count(*)::text AS row_count FROM public."AdminAuditLog"
              UNION ALL SELECT ''Booking'', count(*)::text FROM public."Booking"
              UNION ALL SELECT ''BookingItem'', count(*)::text FROM public."BookingItem"
              UNION ALL SELECT ''BookingPackage'', count(*)::text FROM public."BookingPackage"
              UNION ALL SELECT ''DiagnosticPackage'', count(*)::text FROM public."DiagnosticPackage"
              UNION ALL SELECT ''DiagnosticPartner'', count(*)::text FROM public."DiagnosticPartner"
              UNION ALL SELECT ''DiagnosticTest'', count(*)::text FROM public."DiagnosticTest"
              UNION ALL SELECT ''Patient'', count(*)::text FROM public."Patient"
              UNION ALL SELECT ''PaymentTransaction'', count(*)::text FROM public."PaymentTransaction"
              UNION ALL SELECT ''RazorpayWebhookEvent'', count(*)::text FROM public."RazorpayWebhookEvent"
              UNION ALL SELECT ''TestPartnerOffer'', count(*)::text FROM public."TestPartnerOffer"
              UNION ALL SELECT ''Technician'', count(*)::text FROM public."Technician"
              UNION ALL SELECT ''TechnicianSession'', count(*)::text FROM public."TechnicianSession"
              UNION ALL SELECT ''ThyrocareCredential'', count(*)::text FROM public."ThyrocareCredential"
            ) counts ORDER BY table_name
          ' | sha256sum | cut -d' ' -f1)"
          test "$post_schema_sha" = "$PRE_SCHEMA_SHA"
          test "$post_counts_sha" = "$PRE_COUNTS_SHA"
          test "$post_app_data_sha" = "$PRE_APP_DATA_SHA"
          rm -f "$expected" "$actual"

      - name: Reverify Production health and immutable PR state
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          set +x
          health_json="$(mktemp)"
          pr_json="$(mktemp)"
          curl --fail --silent --show-error \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$PRODUCTION_HEALTH_URL" > "$health_json"
          test "$(jq -r '.database // ""' "$health_json" | tr '[:upper:]' '[:lower:]')" = "ok"
          curl --fail --silent --show-error \
            https://api.github.com/repos/gopalgoudt-lab/TG-LABS-Y1/pulls/21 > "$pr_json"
          test "$(jq -r '.state' "$pr_json")" = "open"
          test "$(jq -r '.merged_at // ""' "$pr_json")" = ""
          test "$(jq -r '.head.sha' "$pr_json")" = "$EXPECTED_PR_HEAD"
          test "$(curl --fail --silent --show-error https://api.github.com/repos/gopalgoudt-lab/TG-LABS-Y1/git/ref/heads/main | jq -r '.object.sha')" = "$APPROVED_SHA"
          rm -f "$health_json" "$pr_json"

      - name: Write non-sensitive completion summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Production Prisma history baseline completed'
            echo
            echo '- Approved SHA verified'
            echo '- PR #21 remained open and unmerged at the expected head'
            echo '- Production project, branch, database and recovery checkpoint verified'
            echo '- Exactly 20 historical migrations marked applied'
            echo '- Phase 2C-1 excluded and not executed'
            echo '- Schema, core counts and application data unchanged'
            echo '- Production health remained OK'
            echo '- No migration SQL was executed'
          } >> "$GITHUB_STEP_SUMMARY"
