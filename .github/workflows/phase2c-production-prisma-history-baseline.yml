name: Phase 2C Production Prisma History Baseline

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the separately authorized operation
        required: true
        type: choice
        options:
          - READ_ONLY_PREFLIGHT
          - BASELINE_20_HISTORICAL_MIGRATIONS_ONLY
      typed_confirmation:
        description: Required only for BASELINE mode
        required: false
        type: string
      approved_schema_sha256:
        description: Required only for BASELINE mode; copy from a successful preflight
        required: false
        type: string
      approved_core_counts_sha256:
        description: Required only for BASELINE mode; copy from a successful preflight
        required: false
        type: string
      approved_application_data_sha256:
        description: Required only for BASELINE mode; copy from a successful preflight
        required: false
        type: string
      reviewed_workflow_sha256:
        description: Exact SHA-256 of the reviewed workflow file
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase2c-production-prisma-history-baseline
  cancel-in-progress: false

jobs:
  controlled-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APPROVED_SHA: 4643df644fef735c65d9cb9139f8b756d331309f
      EXPECTED_PR_HEAD: ad068cb4552ae5de0693faa9c1fc3589c67f49f2
      WORKFLOW_PATH: .github/workflows/phase2c-production-prisma-history-baseline.yml
      NEON_PROJECT_ID: still-lake-20474769
      PRODUCTION_BRANCH_ID: br-wandering-resonance-axwu851y
      PRODUCTION_BRANCH_NAME: production
      PRODUCTION_DATABASE: neondb
      RECOVERY_CHECKPOINT_ID: br-mute-sky-axe5a0c0
      PHASE2C1_MIGRATION: 20260829153000_phase2c1_catalog_eligibility_foundation
      PRODUCTION_HEALTH_URL: https://tg-labs-y1-git-main-gopalgoudt-7623s-projects.vercel.app/api/health

    steps:
      - name: Check out dispatch commit for workflow-only guards
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify ancestry, restricted diff, workflow fingerprint and PR 21
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          REVIEWED_WORKFLOW_SHA256: ${{ inputs.reviewed_workflow_sha256 }}
        run: |
          set -euo pipefail
          set +x
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          case "$OPERATION" in
            READ_ONLY_PREFLIGHT|BASELINE_20_HISTORICAL_MIGRATIONS_ONLY) ;;
            *) echo 'FAIL: invalid operation'; exit 1 ;;
          esac
          [[ "$REVIEWED_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git cat-file -e "$APPROVED_SHA^{commit}"
          git merge-base --is-ancestor "$APPROVED_SHA" "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed_paths="$(git diff --name-only "$APPROVED_SHA..$GITHUB_SHA")"
          test "$changed_paths" = "$WORKFLOW_PATH"
          ! git diff --name-only "$APPROVED_SHA..$GITHUB_SHA" | grep -Eq '^(app/|lib/|pages/|prisma/|public/|src/|tests/|package(-lock)?[.]json$|next[.]config|tsconfig|middleware|vercel[.]json$)'
          test "$(sha256sum "$WORKFLOW_PATH" | cut -d' ' -f1)" = "$REVIEWED_WORKFLOW_SHA256"
          pr_json="$(mktemp)"
          curl --fail --silent --show-error https://api.github.com/repos/gopalgoudt-lab/TG-LABS-Y1/pulls/21 > "$pr_json"
          test "$(jq -r '.state' "$pr_json")" = "open"
          test "$(jq -r '.merged_at // ""' "$pr_json")" = ""
          test "$(jq -r '.head.sha' "$pr_json")" = "$EXPECTED_PR_HEAD"
          rm -f "$pr_json"
          echo 'PASS: dispatch SHA guards, reviewed workflow and PR 21 verified'

      - name: Check out immutable application code separately
        uses: actions/checkout@v4
        with:
          ref: 4643df644fef735c65d9cb9139f8b756d331309f
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable application and exact migration allowlist
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "$expected" <<'MIGRATIONS'
          20260815130000_init
          20260816105000_add_razorpay_booking_fields
          20260816193000_add_whatsapp_notification_tracking
          20260817112000_admin_catalog_and_manual_booking
          20260817113000_add_sample_types
          20260817124500_booking_admin_edit_fields
          20260817133000_add_booking_pincode
          20260817142000_add_technicians
          20260817143000_add_sample_processing_workflow
          20260817161000_phase23_technician_portal
          20260817193000_booking_packages
          20260817201500_patient_profile_fields
          20260818173000_phase28_payment_hardening
          20260820161000_add_admin_audit_log
          20260820170500_phase9_doctor_printed_reports
          20260820193000_persist_ai_reports
          20260821194000_add_thyrocare_credentials
          20260824120500_add_technician_live_location
          20260824131500_add_booking_idempotency
          20260826190000_add_partner_offers
          MIGRATIONS
          find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql -printf '%h\n' | xargs -r -n1 basename | LC_ALL=C sort > "$actual"
          test "$(wc -l < "$actual" | tr -d ' ')" = "20"
          ! grep -Fxq "$PHASE2C1_MIGRATION" "$actual"
          diff --unified=0 "$expected" "$actual" >/dev/null
          rm -f "$expected" "$actual"
          echo 'PASS: immutable application and exact migration allowlist verified'

      - name: Install pinned dependencies and read-only inspection tools
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          test -n "${VERSION_CODENAME:-}"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<PGDG
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          PGDG
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          PG18_BIN=/usr/lib/postgresql/18/bin
          export PATH="$PG18_BIN:$PATH"
          printf '%s\n' "$PG18_BIN" >> "$GITHUB_PATH"
          test "$(command -v psql)" = "$PG18_BIN/psql"
          test "$(command -v pg_dump)" = "$PG18_BIN/pg_dump"
          [[ "$(psql --version)" =~ ^psql\ \(PostgreSQL\)\ 18([.]|$) ]]
          [[ "$(pg_dump --version)" =~ ^pg_dump\ \(PostgreSQL\)\ 18([.]|$) ]]

      - name: Run the selected controlled operation
        shell: bash
        working-directory: app
        env:
          OPERATION: ${{ inputs.operation }}
          TYPED_CONFIRMATION: ${{ inputs.typed_confirmation }}
          APPROVED_SCHEMA_SHA256: ${{ inputs.approved_schema_sha256 }}
          APPROVED_CORE_COUNTS_SHA256: ${{ inputs.approved_core_counts_sha256 }}
          APPROVED_APPLICATION_DATA_SHA256: ${{ inputs.approved_application_data_sha256 }}
          NEON_DATABASE_URL: ${{ secrets.PHASE2C_PRODUCTION_NEON_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.PHASE2B_NEON_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          set +x
          stage() { echo "STAGE: $1"; }
          fail() { echo "FAIL: $1"; exit 1; }

          stage 'runtime secret presence checks'
          test -n "$NEON_DATABASE_URL" || fail 'Production database secret is unavailable'
          test -n "$NEON_API_KEY" || fail 'Neon API secret is unavailable'
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || fail 'Production health bypass secret is unavailable'
          echo "::add-mask::$NEON_DATABASE_URL"
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"

          branches_json="$(mktemp)"
          endpoints_json="$(mktemp)"
          health_json="$(mktemp)"
          trap 'rm -f "$health_json"' EXIT
          stage 'Neon branch and recovery-checkpoint identity checks'
          if ! curl --fail --silent --show-error -H "Authorization: Bearer $NEON_API_KEY" "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" > "$branches_json"; then
            fail 'Neon branch identity request failed'
          fi
          test "$(jq -r --arg id "$PRODUCTION_BRANCH_ID" '.branches[] | select(.id == $id) | .name' "$branches_json")" = "$PRODUCTION_BRANCH_NAME" || fail 'Production branch identity mismatch'
          test "$(jq -r --arg id "$RECOVERY_CHECKPOINT_ID" '[.branches[] | select(.id == $id)] | length' "$branches_json")" = "1" || fail 'Recovery checkpoint identity mismatch'

          stage 'Neon read-write endpoint identity check'
          if ! curl --fail --silent --show-error -H "Authorization: Bearer $NEON_API_KEY" "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/endpoints" > "$endpoints_json"; then
            fail 'Neon endpoint identity request failed'
          fi
          endpoint_count="$(jq -r --arg branch "$PRODUCTION_BRANCH_ID" '[.endpoints[] | select(.branch_id == $branch and .type == "read_write")] | length' "$endpoints_json")"
          test "$endpoint_count" = "1" || fail 'Production read-write endpoint count mismatch'
          expected_host="$(jq -r --arg branch "$PRODUCTION_BRANCH_ID" '.endpoints[] | select(.branch_id == $branch and .type == "read_write") | .host' "$endpoints_json")"
          [[ "$expected_host" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?[.][a-z0-9.-]+$ ]] || fail 'Production read-write endpoint format mismatch'
          endpoint_label="${expected_host%%.*}"
          endpoint_suffix="${expected_host#*.}"
          test "$endpoint_suffix" != "$expected_host" || fail 'Production read-write endpoint format mismatch'
          [[ "$endpoint_label" != *-pooler ]] || fail 'Neon API returned an unexpected pooled endpoint'
          expected_pooler_host="${endpoint_label}-pooler.${endpoint_suffix}"
          if ! actual_host="$(DATABASE_URL_FOR_PARSE="$NEON_DATABASE_URL" node -e 'const u=new URL(process.env.DATABASE_URL_FOR_PARSE); process.stdout.write(u.hostname)' 2>/dev/null)"; then
            fail 'Production database hostname parsing failed'
          fi
          if [ "$actual_host" != "$expected_host" ] && [ "$actual_host" != "$expected_pooler_host" ]; then
            fail 'Production database endpoint identity mismatch'
          fi
          stage 'Production database endpoint identity accepted'

          check_production_health() {
            local health_http_status
            if ! health_http_status="$(curl --silent --output "$health_json" --write-out '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PRODUCTION_HEALTH_URL" 2>/dev/null)"; then
              fail 'Production health request was not successful'
            fi
            test "$health_http_status" = "200" || fail 'Production health request was not successful'
            jq -e . "$health_json" >/dev/null 2>&1 || fail 'Production health response was not valid JSON'
            jq -e '.status == "ok" and .database == "ok"' "$health_json" >/dev/null 2>&1 || fail 'Production health identity did not match'
          }

          stage 'Production health and database identity checks'
          check_production_health
          test "$(psql "$NEON_DATABASE_URL" -XAtqc 'SELECT current_database()')" = "$PRODUCTION_DATABASE"
          rm -f "$branches_json" "$endpoints_json" "$health_json"

          test "$(psql "$NEON_DATABASE_URL" -XAtqc "SELECT to_regclass('public._prisma_migrations') IS NULL")" = "t"
          phase2c1_absent="$(psql "$NEON_DATABASE_URL" -XAtq <<'SQL'
          SELECT NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'DiagnosticPackageType')
            AND to_regclass('public."CatalogCategory"') IS NULL
            AND to_regclass('public."PackagePartnerOffer"') IS NULL
            AND to_regclass('public."PartnerServiceability"') IS NULL;
          SQL
          )"
          test "$phase2c1_absent" = "t"

          fingerprint_state() {
            STATE_SCHEMA_SHA="$(pg_dump "$NEON_DATABASE_URL" --schema-only --no-owner --no-privileges --exclude-table=public._prisma_migrations --restrict-key=Phase2CBaselineFingerprintV1 | sha256sum | cut -d' ' -f1)"
            STATE_APP_DATA_SHA="$(pg_dump "$NEON_DATABASE_URL" --data-only --no-owner --no-privileges --exclude-table=public._prisma_migrations --restrict-key=Phase2CBaselineFingerprintV1 | sha256sum | cut -d' ' -f1)"
            STATE_COUNTS_SHA="$(psql "$NEON_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 <<'SQL' | sha256sum | cut -d' ' -f1
              SELECT table_name || '=' || row_count FROM (
                SELECT 'AdminAuditLog' AS table_name, count(*)::text AS row_count FROM public."AdminAuditLog"
                UNION ALL SELECT 'Booking', count(*)::text FROM public."Booking"
                UNION ALL SELECT 'BookingItem', count(*)::text FROM public."BookingItem"
                UNION ALL SELECT 'BookingPackage', count(*)::text FROM public."BookingPackage"
                UNION ALL SELECT 'DiagnosticPackage', count(*)::text FROM public."DiagnosticPackage"
                UNION ALL SELECT 'DiagnosticPartner', count(*)::text FROM public."DiagnosticPartner"
                UNION ALL SELECT 'DiagnosticTest', count(*)::text FROM public."DiagnosticTest"
                UNION ALL SELECT 'Patient', count(*)::text FROM public."Patient"
                UNION ALL SELECT 'PaymentTransaction', count(*)::text FROM public."PaymentTransaction"
                UNION ALL SELECT 'RazorpayWebhookEvent', count(*)::text FROM public."RazorpayWebhookEvent"
                UNION ALL SELECT 'TestPartnerOffer', count(*)::text FROM public."TestPartnerOffer"
                UNION ALL SELECT 'Technician', count(*)::text FROM public."Technician"
                UNION ALL SELECT 'TechnicianSession', count(*)::text FROM public."TechnicianSession"
                UNION ALL SELECT 'ThyrocareCredential', count(*)::text FROM public."ThyrocareCredential"
              ) counts ORDER BY table_name;
          SQL
            )"
          }
          fingerprint_state
          PRE_SCHEMA_SHA="$STATE_SCHEMA_SHA"
          PRE_COUNTS_SHA="$STATE_COUNTS_SHA"
          PRE_APP_DATA_SHA="$STATE_APP_DATA_SHA"
          {
            echo 'PASS: READ-ONLY Production preflight fingerprints calculated'
            echo "schema_sha256=$PRE_SCHEMA_SHA"
            echo "core_counts_sha256=$PRE_COUNTS_SHA"
            echo "application_data_sha256=$PRE_APP_DATA_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$OPERATION" = "READ_ONLY_PREFLIGHT" ]; then
            echo 'PASS: READ_ONLY_PREFLIGHT completed; no Production write command ran'
            exit 0
          fi

          test "$OPERATION" = "BASELINE_20_HISTORICAL_MIGRATIONS_ONLY"
          test "$TYPED_CONFIRMATION" = "BASELINE_20_HISTORICAL_MIGRATIONS_ONLY"
          for value in "$APPROVED_SCHEMA_SHA256" "$APPROVED_CORE_COUNTS_SHA256" "$APPROVED_APPLICATION_DATA_SHA256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          test "$PRE_SCHEMA_SHA" = "$APPROVED_SCHEMA_SHA256"
          test "$PRE_COUNTS_SHA" = "$APPROVED_CORE_COUNTS_SHA256"
          test "$PRE_APP_DATA_SHA" = "$APPROVED_APPLICATION_DATA_SHA256"

          migrations=(
            20260815130000_init
            20260816105000_add_razorpay_booking_fields
            20260816193000_add_whatsapp_notification_tracking
            20260817112000_admin_catalog_and_manual_booking
            20260817113000_add_sample_types
            20260817124500_booking_admin_edit_fields
            20260817133000_add_booking_pincode
            20260817142000_add_technicians
            20260817143000_add_sample_processing_workflow
            20260817161000_phase23_technician_portal
            20260817193000_booking_packages
            20260817201500_patient_profile_fields
            20260818173000_phase28_payment_hardening
            20260820161000_add_admin_audit_log
            20260820170500_phase9_doctor_printed_reports
            20260820193000_persist_ai_reports
            20260821194000_add_thyrocare_credentials
            20260824120500_add_technician_live_location
            20260824131500_add_booking_idempotency
            20260826190000_add_partner_offers
          )
          for index in "${!migrations[@]}"; do
            migration="${migrations[$index]}"
            expected_count="$((index + 1))"
            test "$migration" != "$PHASE2C1_MIGRATION"
            if ! npx --no-install prisma migrate resolve --applied "$migration" --schema prisma/schema.prisma >/dev/null 2>&1; then
              echo "FAIL: migrate resolve stopped at approved history entry $expected_count"
              exit 1
            fi
            test "$(psql "$NEON_DATABASE_URL" -XAtqc 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" = "$expected_count"
            ! psql "$NEON_DATABASE_URL" -XAtqc 'SELECT migration_name FROM public._prisma_migrations' | grep -Fxq "$PHASE2C1_MIGRATION"
            fingerprint_state
            test "$STATE_SCHEMA_SHA" = "$PRE_SCHEMA_SHA"
            test "$STATE_COUNTS_SHA" = "$PRE_COUNTS_SHA"
            test "$STATE_APP_DATA_SHA" = "$PRE_APP_DATA_SHA"
          done

          expected="$(mktemp)"
          actual="$(mktemp)"
          find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql -printf '%h\n' | xargs -r -n1 basename | LC_ALL=C sort > "$expected"
          psql "$NEON_DATABASE_URL" -XAtqc 'SELECT migration_name FROM public._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name' > "$actual"
          test "$(wc -l < "$actual" | tr -d ' ')" = "20"
          diff --unified=0 "$expected" "$actual" >/dev/null
          ! grep -Fxq "$PHASE2C1_MIGRATION" "$actual"
          test "$(psql "$NEON_DATABASE_URL" -XAtqc 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL')" = "0"
          fingerprint_state
          test "$STATE_SCHEMA_SHA" = "$PRE_SCHEMA_SHA"
          test "$STATE_COUNTS_SHA" = "$PRE_COUNTS_SHA"
          test "$STATE_APP_DATA_SHA" = "$PRE_APP_DATA_SHA"
          health_json="$(mktemp)"
          pr_json="$(mktemp)"
          stage 'post-baseline Production health identity check'
          check_production_health
          curl --fail --silent --show-error https://api.github.com/repos/gopalgoudt-lab/TG-LABS-Y1/pulls/21 > "$pr_json"
          test "$(jq -r '.state' "$pr_json")" = "open"
          test "$(jq -r '.merged_at // ""' "$pr_json")" = ""
          test "$(jq -r '.head.sha' "$pr_json")" = "$EXPECTED_PR_HEAD"
          rm -f "$expected" "$actual" "$health_json" "$pr_json"
          echo 'PASS: BASELINE completed with exactly 20 historical records and unchanged Production application state'
